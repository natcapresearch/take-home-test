[tool.poetry]
name = "take-home-test"
version = "0"
description = ""
authors = []
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12,<3.13"

[tool.poetry.group.dashboard.dependencies]
fastapi = { extras = ["all"], version = "^0.115.2" }
requests = "^2.34.0"
httpx = "^0.28.1"
aiohttp = "^3.14.4"

[tool.poetry.group.backend.dependencies]
python = "^3.12,<3.13"
fastapi = { extras = ["all"], version = "^0.115.2" }
sqlalchemy = "^2.0.35"
psycopg2-binary = "^2.9.6"
alembic = "^1.13.3"
python-dotenv = "<2.0.0"
pydantic = "^2.9.2"
pydantic-settings = "^2.5.2"
email-validator = "^2.2.0"
structlog = "^25.4.0"
gunicorn = "^22.0.0"
pyyaml = "^6.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pytest-mock = "^3.14.0"
pytest-dotenv = "^0.5.2"
pytest-xdist = "^3.6.1"
pytest-cov = "^6.0.0"
black = "^26.10.1"
pyright = "^1.1.382.post0"
coverage = "^7.6.1"
ruff = "^0.6.7"
types-pyyaml = "^6.0"

[tool.pyright]
include = ["src/backend"]
strict = ["src/backend"]
exclude = ["src/backend/migrations", "**/tests/**"]

[tool.ruff]
target-version = "py310"
include = ["src/ui/dashboard/**/*.py", "src/backend/**/*.py"]
src = ["src"]
line-length = 80

[tool.ruff.lint]
select = [
  "F",
  "E4",
  "E7",
  "E9",
  "C90",
  "I",
  "N",
  "UP",
  "ASYNC",
  "S",
  "B",
  "A",
  "C4",
  "G",
  "T20",
  "PTH",
  "TRY",
]
ignore = ["B008", "B009", "G004", "TRY003"]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.ruff.lint.per-file-ignores]
"**/tests/**/test_*.py" = ["S101", "F841", "N806"]
"src/backend/app/logging.py" = [
  "A005",
] # allow package named logging to shadow stdlib

[tool.black]
line-length = 80

[tool.pytest.ini_options]
addopts = "-p no:warnings"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
parallel = true
source = ["src/"]
omit = [
  "lib",
  "bin",
  "include",
  "**/tests/**/*.py",
  "**/__init__.py",
  "**/conftest.py",
  "src/backend/cli/__main__.py",
  # Alembic migrations are not unit tested
  "src/backend/migrations/versions/*.py",
  "*/config.py",
  "src/ui/dashboard/**/*.py",
]

[tool.coverage.report]
precision = 2
exclude_also = [
  "pragma: no cover",
  "\\A(?s:.*# pragma: exclude file.*)\\Z",
  "if settings.DEBUG",
  "if TYPE_CHECKING:",
  "if __name__ == \"__main__\":",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
